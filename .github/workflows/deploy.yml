# Deploys DetectorData, DetectorBatch and DetectorApi when a pull request is merged into
# develop. A direct push to develop runs the checks but doesn't deploy (the gate job).
# DetectorCi (the GitHub roles themselves) is deployed locally only: make deploy-ci.
# A deploy never starts GPU workers: the services stay at 0 tasks until images arrive.
name: Deploy

on:
  push:
    branches: [develop]

permissions:
  contents: read

# Deploys queue up; one never cancels another halfway through CloudFormation.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-west-2' }}
  STACKS: DetectorData-dev DetectorBatch-dev DetectorApi-dev

jobs:
  gate:
    name: Merged PR?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
    steps:
      - id: check
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit(
              { owner, repo, commit_sha: context.sha });
            // Merge, squash and rebase merges all end with the PR's merge_commit_sha.
            const pr = prs.find((p) =>
              p.merged_at && p.base.ref === "develop" && p.merge_commit_sha === context.sha);
            core.setOutput("deploy", pr ? "true" : "false");
            if (pr) {
              core.notice(`Deploying ${context.sha.slice(0, 7)}, merged from PR #${pr.number}`);
            } else {
              core.notice(`${context.sha.slice(0, 7)} is not from a merged PR; not deployed`);
            }

  checks:
    uses: ./.github/workflows/checks.yml
    secrets:
      ENVIRONMENTS_CONF_JSON: ${{ secrets.ENVIRONMENTS_CONF_JSON }}

  deploy:
    name: CDK deploy
    needs: [gate, checks]
    if: needs.gate.outputs.deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    # The deploy role trusts only jobs in this environment (OIDC subject
    # repo:<owner>/<repo>:environment:dev). Its settings limit it to the develop branch, and
    # required reviewers can be added there without code changes.
    environment:
      name: dev
    permissions:
      contents: read
      id-token: write # OIDC token for the deploy role
    steps:
      # The runner has one 72 GB disk (~13 GB free). Removing preinstalled SDKs it doesn't
      # need leaves ~40 GB; building the GPU image straight to ECR (below) needs ~25 GB.
      - name: Free disk space
        run: |
          df -h /
          sudo swapoff -a && sudo rm -f /swapfile /mnt/swapfile
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
            /usr/local/share/boost /usr/share/swift /usr/lib/jvm /usr/local/share/powershell \
            /opt/microsoft /opt/az /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/go \
            /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Ruby /opt/hostedtoolcache/Java_*
          docker system prune -af >/dev/null
          df -h /

      - uses: docker/setup-qemu-action@v3 # the Lambda image is arm64
        with:
          platforms: arm64

      # A docker-container builder: it can push an image and export a registry cache
      # without loading the image into the local Docker store (no 18 GB unpack).
      - uses: docker/setup-buildx-action@v3

      - uses: actions/checkout@v5

      # Only the CDK app's dependencies: the checks job already ran the tests, and the ML
      # stack (torch with CUDA, ~10 GB) would only take disk space here.
      - uses: ./.github/actions/setup
        with:
          uv-sync-args: --no-default-groups --group infra
          uv-cache: "false" # the checks job's cache holds the ML wheels (GBs) this job skips
          environments-conf: ${{ secrets.ENVIRONMENTS_CONF_JSON }}

      # The deploy role may assume only the CDK bootstrap roles; CloudTrail shows this
      # session name, so every change traces back to a run.
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gh-deploy-${{ github.run_id }}
          role-duration-seconds: 7200
          aws-region: ${{ env.AWS_REGION }}

      # ci_cache=1 puts the layer cache (the build-cache ECR repo) into the asset manifests.
      # Every image whose tag isn't in ECR yet is built and pushed straight to ECR from
      # those manifests (scripts/ci_publish_images.py), reusing unchanged layers from the
      # cache. cdk deploy then finds all images in ECR and builds nothing.
      - name: Build and push images
        working-directory: infra
        run: |
          npx cdk synth -c env=dev -c ci_cache=1 --quiet
          uv run python ../scripts/ci_publish_images.py cdk.out
          df -h /

      - name: CDK deploy
        working-directory: infra
        run: |
          npx cdk deploy $STACKS -c env=dev -c ci_cache=1 --require-approval never --ci \
            --outputs-file "$RUNNER_TEMP/outputs.json"

      - name: Deploy summary
        if: success()
        run: |
          {
            echo "### Deployed ${GITHUB_SHA::7}"
            echo
            echo "| Stack | Output | Value |"
            echo "| --- | --- | --- |"
            jq -r 'to_entries[] | .key as $s | .value | to_entries[]
                   | "| \($s) | \(.key) | `\(.value)` |"' "$RUNNER_TEMP/outputs.json"
          } >> "$GITHUB_STEP_SUMMARY"
